<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
    <title>{{ block "title" . }}{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ site.Title }}{{ end }}</title>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    {{- /* 恢复手动选的深浅色，放在样式之前避免闪一下 */}}
    <script>try { document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem('theme') || 'light dark' } catch {}</script>
    <meta content="yes" name="mobile-web-app-capable"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="notranslate" name="google"/>
    <meta content="{{ site.Params.description }}" name="description"/>
    <meta content="{{ site.Params.keywords }}" name="keywords"/>
    <meta name="theme-color" content="#9370DB">
    {{- range slice "css/backup.css" "css/Diaspora.css" "css/github-markdown.css" }}
    <link rel="stylesheet" href="{{ (resources.Get . | minify | fingerprint).RelPermalink }}">
    {{- end }}
    <link rel="icon" href="{{ (resources.Get "favicon.ico").RelPermalink }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.Title }} &raquo; RSS 2.0" href="/feed" />
</head>
<body x-data="smoe">
{{- /* 开场推门：图层在 backup.css，结构和时间线在 Diaspora.css 的 #door，播完由 Smoe.js 移除 */}}
<div id="door" aria-hidden="true">
    {{- range slice "l" "r" }}
    <div class="door-{{ . }}"><div class="stage"><div class="medal">
        <i class="base"></i>
        <div class="bloom"><div class="grow-o"><i class="spin-cw"></i></div><div class="grow-i"><i class="spin-ccw"></i></div></div>
        <i class="top"></i>
    </div></div></div>
    {{- end }}
</div>
{{ block "main" . }}{{ end }}
<script src="{{ (resources.Get "js/Smoe.js" | minify | fingerprint).RelPermalink }}"></script>
<script src="{{ (resources.Get "js/alpine.min.js" | fingerprint).RelPermalink }}" defer></script>
</body>
</html>
