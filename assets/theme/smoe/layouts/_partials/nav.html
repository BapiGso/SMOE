<details x-ref="nav" @toggle="if (open) scrollTo(0, 0)">
    <summary>
        {{ partial "icon.html" "logo" }}
        {{ partial "icon.html" "menu" }}
    </summary>

    <div>
        <ul>
            {{- range site.Menus.main }}
            <li id="{{ path.Base .URL }}">
                <a @click.prevent="ajaxPost($el.href)" href="{{ partial "url.html" .URL }}" class="pagelist">{{ .Name }}</a>
            </li>
            {{- end }}
        </ul>
        <p>© 2020 <a href="/">{{ site.Title }}</a>. Power By <a rel="external nofollow" href="https://github.com/BapiGso/smoe">{{ partial "icon.html" "signature" }}</a>.
            Theme <a href="https://github.com/LoeiFy/Diaspora">Diaspora</a>.
        </p>
    </div>
</details>
