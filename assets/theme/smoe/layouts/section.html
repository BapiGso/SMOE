{{ define "main" }}
<article class="page timeline">
    <header class="page-header">
        {{ partial "back.html" }}
    </header>
    <section>
        {{- range .Pages.GroupByDate "2006" }}
        <h2><strong>{{ .Key }} 年</strong></h2>
        {{- range .Pages.GroupByDate "01" }}
        <b>{{ .Key }} 月</b>
        <ul>
            {{- range .Pages }}
            <li><a href="{{ partial "url.html" .RelPermalink }}">{{ .Title }}</a></li>
            {{- end }}
        </ul>
        {{- end }}
        {{- end }}
    </section>
</article>
{{ end }}
