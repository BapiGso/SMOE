{{ define "main" }}
<style>
.timeline {
    & > section {
        position: relative;
        width: 92%;
        max-width: 700px;
        padding-left: 30px;
        margin-bottom: 80px;
        text-align: left;

        & > * {
            margin-top: 0;
        }

        &::before {
            content: '';
            position: absolute;
            left: 5px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--c-border);
        }
    }

    & h2 {
        position: relative;
        font-size: 18px;
        color: var(--c-text);
        margin: 40px 0 0;

        &:first-child {
            margin-top: 0;
        }

        &::before {
            content: '';
            position: absolute;
            left: -29px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            background: var(--c-text);
            border-radius: 50%;
        }
    }

    & b {
        display: block;
        position: relative;
        font-size: 13px;
        font-weight: 600;
        color: var(--c-subtle);
        margin: 20px 0 4px;
        letter-spacing: 1px;

        &::before {
            content: '';
            position: absolute;
            left: -27px;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 6px;
            background: var(--c-border);
            border-radius: 50%;
        }
    }

    & ul {
        margin: 0;
        padding: 0;
    }

    & li {
        list-style: none;

        & a {
            display: block;
            color: var(--c-muted);
            text-decoration: none;
            font-size: 14px;
            line-height: 2;
            transition: color 0.2s ease;

            &:hover {
                color: var(--c-text);
            }
        }
    }
}
</style>

<article class="page timeline">
    <header class="page-header">
        <button data-action="back" @click="goBack()" aria-label="返回">{{ partial "icon.html" "back" }}</button>
    </header>
    <section>
        {{- range .Pages.ByDate.Reverse.GroupByDate "2006" }}
        <h2><strong>{{ .Key }} 年</strong></h2>
        {{- range .Pages.GroupByDate "01" }}
        <b>{{ .Key }} 月</b>
        <ul>
            {{- range .Pages }}
            <li><a href="{{ partial "url.html" .RelPermalink }}">{{ .Title }}</a></li>
            {{- end }}
        </ul>
        {{- end }}
        {{- end }}
    </section>
</article>
{{ end }}
