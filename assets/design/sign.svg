        <style>
            #smoe {
                width: 80%;
                max-width: 600px;
                --path-length: 3000;
                --animation-duration: 8s;
            }

            .signature-path {
                stroke-dasharray: var(--path-length);
                stroke-dashoffset: var(--path-length);
                animation: draw-and-erase var(--animation-duration) ease-in-out forwards infinite;
            }

            @keyframes draw-and-erase {
                0% {
                    opacity: 0;
                    stroke-dashoffset: var(--path-length);
                }
                5% {
                    opacity: 1;
                }
                50% {
                    stroke-dashoffset: 0;
                }
                70% {
                    stroke-dashoffset: 0;
                }
                95%, 100% {
                    opacity: 1;
                    stroke-dashoffset: var(--path-length);
                }
            }
        </style>
    </defs>
