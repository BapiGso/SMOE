name: Update go.mod

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Bump Go directive to current toolchain
        run: |
          current=$(go env GOVERSION | sed 's/^go//')
          major_minor=$(echo "$current" | cut -d. -f1,2)
          echo "Using Go $current → setting module go directive to $major_minor"
          go mod edit -go="$major_minor"

      - name: Upgrade all dependencies
        run: |
          go get -u ./...
          go mod tidy

      - name: Build & test
        run: |
          go build ./...
          go test ./... || true

      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: monthly go.mod refresh'
          title: 'chore: monthly go.mod refresh'
          body: |
            Automated monthly bump of Go toolchain directive and all module dependencies.

            - `go mod edit -go=<latest>`
            - `go get -u ./...`
            - `go mod tidy`

            Generated by `.github/workflows/update-gomod.yaml`.
          branch: chore/gomod-refresh
          delete-branch: true
          add-paths: |
            go.mod
            go.sum
