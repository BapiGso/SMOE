on:
  push:
    tags: ['*']
  workflow_dispatch:

name: Build Release

permissions:
  contents: write

env:
  NAME: ${{ github.event.repository.name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Build linux/amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "${NAME}_linux_amd64" -trimpath -ldflags="-s -w"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.NAME }}_linux_amd64
